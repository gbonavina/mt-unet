[project]
name = "mt-unet"
version = "0.1.0"
description = "Multitask U-Net for CASIA2 authentic/tampered classification and tamper segmentation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google>=3.0.0",
    "numpy",
    "pandas",
    "pillow",
    "scikit-learn",
    "torch",
    "torchvision>=0.29.0",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
